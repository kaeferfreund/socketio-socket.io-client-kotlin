name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UPSTREAM_SHA: aaf2af36ec8ad05910f357a788e0e358bad32738

jobs:
  hygiene:
    name: Documentation, validators and repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test the documentation checker
        run: python3 scripts/test-documentation.py
      - name: Check links, anchors and the README quick start marker
        run: python3 scripts/check-documentation.py
      - name: Test the parity validator
        run: python3 scripts/test-review-regressions.py
      - name: Check parity contracts against the test sources
        run: python3 scripts/check-parity-contracts.py --strict
      - name: Test the API mapping checker
        run: python3 scripts/test-api-parity.py
      - name: Every mapped JavaScript API member resolves to a Kotlin symbol
        run: python3 scripts/check-api-parity.py
      - name: Shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: No generated or secret files are tracked
        run: |
          ! git ls-files | grep -E '(^|/)(build|node_modules|\.gradle)/|local\.properties$|\.(jks|keystore|p12|pem|key)$'

  jvm-tests:
    name: Build, unit tests and static checks (JDK ${{ matrix.java }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # 21 is always installed: Robolectric runs the Android unit tests on it.
          java-version: |
            21
            ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Compile, test, lint, detekt, Android lint and API check
        run: ./gradlew check -x :e2e-tests:test --continue
      - name: Coverage report
        # Per-module reports; the merged one (with end-to-end) is produced by the e2e job.
        run: ./gradlew koverXmlReport -x :koverXmlReport -x :e2e-tests:test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: jvm-test-results-${{ matrix.java }}
          path: |
            */build/test-results/**/*.xml
            */build/reports/kover/report.xml
          retention-days: 7

  e2e:
    name: End-to-end against Node fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            21
            17
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install the pinned fixture dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: fixtures
      - name: Protocol proofs of the fixtures
        working-directory: fixtures
        run: |
          node --test *.test.mjs
          node upgrade-race-proof.mjs
          node max-payload-proof.mjs
      - name: End-to-end suites (HTTP, HTTPS, WS, WSS, mTLS) and merged JVM coverage
        run: ./gradlew :e2e-tests:test :koverXmlReport
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: e2e-test-results
          path: |
            e2e-tests/build/test-results/**/*.xml
            build/reports/kover/report.xml
          retention-days: 7

  parity-gate:
    name: Strict parity with passed executions
    needs: [jvm-tests, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jvm-test-results-17
          path: results/jvm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-test-results
          path: results/e2e
      - name: Every contract test passed in this run; no supported row is uncertified
        run: |
          python3 scripts/check-parity-contracts.py --strict \
            --junit 'results/**/*.xml' --summary "$RUNNER_TEMP/parity-summary.json"
          cat "$RUNNER_TEMP/parity-summary.json"
      - name: Coverage of this run (JVM across all suites; Android under Robolectric)
        run: |
          python3 scripts/coverage-summary.py --jvm results/e2e/build/reports/kover/report.xml \
            --android results/jvm/socketio-android/build/reports/kover/report.xml --out "$RUNNER_TEMP/coverage-summary.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: parity-summary
          path: |
            ${{ runner.temp }}/parity-summary.json
            ${{ runner.temp }}/coverage-summary.json
          retention-days: 30

  parser-parity:
    name: Parser differential against the pinned JavaScript parser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: socketio/socket.io
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream-reference
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            21
            17
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install the TypeScript transpiler for the pinned parser source
        run: npm install --prefix "$RUNNER_TEMP/parity-tools" --ignore-scripts --no-audit --no-fund typescript@5.8.3
      - name: Compare decoders and encoders
        run: |
          export NODE_PATH="$RUNNER_TEMP/parity-tools/node_modules"
          bash scripts/test-parser-parity.sh "$GITHUB_WORKSPACE/upstream-reference" "$RUNNER_TEMP/decoder-differential.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: decoder-differential
          path: ${{ runner.temp }}/decoder-differential.json
          retention-days: 7

  upstream-clients:
    name: Pinned upstream Node suites and declaration inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: socketio/socket.io
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream-reference
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # The pinned upstream Mocha/tsx dependency graph is validated on Node 24.
          node-version: 24
      - name: Original Node suites (browser and WebTransport runners excluded)
        run: bash scripts/test-upstream-clients.sh "$GITHUB_WORKSPACE/upstream-reference" "$RUNNER_TEMP/upstream-client-results"
      - name: The API mapping covers exactly the pinned upstream API
        run: |
          python3 scripts/check-api-parity.py --upstream "$GITHUB_WORKSPACE/upstream-reference" \
            --summary "$RUNNER_TEMP/upstream-client-results/api-parity-summary.json"
          cat "$RUNNER_TEMP/upstream-client-results/api-parity-summary.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: upstream-client-results
          path: ${{ runner.temp }}/upstream-client-results
          retention-days: 7

  consumer:
    name: README quick start in an independent consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            21
            17
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Publish to mavenLocal and compile the quick start with the Kotlin AGP bundles
        run: bash scripts/test-consumer.sh

  android-emulator:
    name: Instrumented tests on API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            21
            17
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build the test APKs before the emulator starts
        run: ./gradlew :socketio-android:assembleDebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.api >= 30 && 'google_apis' || 'default' }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/test-device.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: android-test-results-${{ matrix.api }}
          path: socketio-android/build/outputs/androidTest-results
          retention-days: 7
