<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="title desc">
  <title id="title">Stylized beetle sending signals</title>
  <desc id="desc">An original, stylized beetle in violet, magenta and coral whose antennae send green signal arcs, drawn for the README of this project.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7F52FF"/>
      <stop offset="55%" stop-color="#C711E1"/>
      <stop offset="100%" stop-color="#E44857"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A3A58"/>
      <stop offset="100%" stop-color="#101827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g fill="none" stroke="#3DDC84" stroke-linecap="round" stroke-width="7">
    <path d="M238 44a26 26 0 0 1 20 22" opacity="0.95"/>
    <path d="M246 22a50 50 0 0 1 34 40" opacity="0.6"/>
    <path d="M254 2a74 74 0 0 1 48 58" opacity="0.3"/>
  </g>

  <g filter="url(#shadow)" transform="translate(-6 -10) rotate(28 150 130)">
    <g stroke="#101827" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M96 112l-28-14"/>
      <path d="M90 140l-32 0"/>
      <path d="M96 168l-26 18"/>
      <path d="M204 112l28-14"/>
      <path d="M210 140l32 0"/>
      <path d="M204 168l26 18"/>
      <path d="M140 66c-10-24-24-36-40-34"/>
      <path d="M160 66c10-24 24-36 40-34"/>
    </g>
    <ellipse cx="150" cy="78" rx="32" ry="24" fill="url(#head)"/>
    <circle cx="136" cy="74" r="5" fill="#FFFFFF"/>
    <circle cx="164" cy="74" r="5" fill="#FFFFFF"/>
    <path d="M78 146c0-38 30-60 72-60s72 22 72 60-32 56-72 56-72-18-72-56z" fill="url(#shell)"/>
    <path d="M150 90v110" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="4"/>
    <circle cx="114" cy="134" r="11" fill="#FFFFFF" fill-opacity="0.9"/>
    <circle cx="186" cy="134" r="11" fill="#FFFFFF" fill-opacity="0.9"/>
    <circle cx="124" cy="174" r="8" fill="#FFFFFF" fill-opacity="0.75"/>
    <circle cx="176" cy="174" r="8" fill="#FFFFFF" fill-opacity="0.75"/>
    <path d="M96 122c10-18 28-28 50-30" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
